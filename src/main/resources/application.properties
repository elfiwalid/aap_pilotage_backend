spring.application.name=backend_pfe

# ── PostgreSQL ──────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/pfe_stafftostaff
spring.datasource.username=postgres
spring.datasource.password=Monmot1
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── JWT Configuration ──────────────────────────────
# Base64-encoded HS256 secret key (256 bits minimum)
jwt.secret=U3RhZmYyU3RhZmZTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24yMDI2UEZFUHJvamVjdA==
# Token validity: 24 hours (in milliseconds)
jwt.expiration=86400000

# ── Server ─────────────────────────────────────────
server.port=8080
# -- Multipart Configuration ------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
